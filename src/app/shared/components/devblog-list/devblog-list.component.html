<div *ngIf="errorMessage" class="alert alert-danger m-3" role="alert">
    {{ errorMessage }}
</div>

<div class="d-flex justify-content-center" *ngIf="loading">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<div *ngIf="!loading && !errorMessage && devBlogs.length === 0" class="empty-state text-center py-5 px-3 border rounded" role="status">
    <p class="empty-state__message mb-0">No dev blog posts yet. Check back soon.</p>
</div>

<div *ngIf="!loading && devBlogs.length">
    <div
        class="card devblog-card shadow-sm mb-3"
        *ngFor="let devBlog of devBlogs"
    >
        <div class="card-header devblog-card__header border-0">
            <div class="container-fluid px-0">
                <div class="row align-items-center g-2">
                    <div class="col-12 col-sm-8">
                        <strong>{{ devBlog.title }}</strong>
                    </div>
                    <div class="col-12 col-sm-4 text-sm-end">
                        <strong>{{ formatDate(devBlog.date) }}</strong>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-body devblog-card__body border-0">
            <p class="card-text">
                {{ devBlog.body }}
            </p>
        </div>
    </div>
</div>
