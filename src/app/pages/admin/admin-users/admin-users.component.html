<h1 class="h3 mb-3">Users</h1>

<app-crud-list-panel
    [loading]="loading"
    [errorMessage]="errorMessage"
    [isEmpty]="!loading && !errorMessage && users.length === 0"
    emptyMessage="No users found."
>
    <div
        class="table-responsive"
        *ngIf="!loading && !errorMessage && users.length"
    >
        <table class="table table-sm align-middle">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Active</th>
                    <th *ngIf="canPatch"></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let user of users">
                    <td>{{ user.username }}</td>
                    <td>{{ user.email }}</td>
                    <td>{{ user.role }}</td>
                    <td>{{ user.is_active ? "Yes" : "No" }}</td>
                    <td *ngIf="canPatch" class="text-nowrap">
                        <button
                            type="button"
                            class="btn btn-link btn-sm p-0 me-2"
                            (click)="startEdit(user)"
                        >
                            Edit
                        </button>
                        <button
                            type="button"
                            class="btn btn-link btn-sm p-0 text-danger"
                            *ngIf="user.is_active"
                            (click)="deactivate(user)"
                            [disabled]="submitting"
                        >
                            Deactivate
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</app-crud-list-panel>

<div class="card shadow-sm mb-4" *ngIf="canCreate">
    <div class="card-header">Create user</div>
    <div class="card-body">
        <form [formGroup]="createForm" (ngSubmit)="createUser()">
            <div class="row g-2">
                <div class="col-md-6">
                    <label class="form-label" for="new-username"
                        >Username</label
                    >
                    <input
                        id="new-username"
                        class="form-control"
                        formControlName="username"
                    />
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="new-email">Email</label>
                    <input
                        id="new-email"
                        class="form-control"
                        formControlName="email"
                    />
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="new-password"
                        >Password</label
                    >
                    <input
                        id="new-password"
                        type="password"
                        class="form-control"
                        formControlName="password"
                    />
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="new-role">Role</label>
                    <select
                        id="new-role"
                        class="form-select"
                        formControlName="role"
                    >
                        <option value="admin">admin</option>
                        <option value="maintainer">maintainer</option>
                        <option value="read_only">read_only</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="new-first">First name</label>
                    <input
                        id="new-first"
                        class="form-control"
                        formControlName="first_name"
                    />
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="new-last">Last name</label>
                    <input
                        id="new-last"
                        class="form-control"
                        formControlName="last_name"
                    />
                </div>
            </div>
            <div
                class="alert alert-danger mt-3 mb-0"
                *ngIf="formError && !editingId"
            >
                {{ formError }}
            </div>
            <button
                type="submit"
                class="btn btn-primary mt-3"
                [disabled]="createForm.invalid || submitting"
            >
                Create
            </button>
        </form>
    </div>
</div>

<div class="card shadow-sm" *ngIf="editingId !== null && canPatch">
    <div class="card-header">Edit user #{{ editingId }}</div>
    <div class="card-body">
        <form [formGroup]="editForm" (ngSubmit)="saveEdit()">
            <div class="row g-2">
                <div class="col-md-6">
                    <label class="form-label" for="edit-email">Email</label>
                    <input
                        id="edit-email"
                        class="form-control"
                        formControlName="email"
                    />
                </div>
                <div class="col-md-6" *ngIf="isAdmin">
                    <label class="form-label" for="edit-password"
                        >New password</label
                    >
                    <input
                        id="edit-password"
                        type="password"
                        class="form-control"
                        formControlName="password"
                        autocomplete="new-password"
                    />
                    <div class="form-text">
                        Leave blank to keep the current password.
                    </div>
                </div>
                <div class="col-md-3" *ngIf="isAdmin">
                    <label class="form-label" for="edit-role">Role</label>
                    <select
                        id="edit-role"
                        class="form-select"
                        formControlName="role"
                    >
                        <option value="admin">admin</option>
                        <option value="maintainer">maintainer</option>
                        <option value="read_only">read_only</option>
                    </select>
                </div>
                <div class="col-md-3 d-flex align-items-end" *ngIf="isAdmin">
                    <div class="form-check">
                        <input
                            id="edit-active"
                            class="form-check-input"
                            type="checkbox"
                            formControlName="is_active"
                        />
                        <label class="form-check-label" for="edit-active"
                            >Active</label
                        >
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="edit-first"
                        >First name</label
                    >
                    <input
                        id="edit-first"
                        class="form-control"
                        formControlName="first_name"
                    />
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="edit-last">Last name</label>
                    <input
                        id="edit-last"
                        class="form-control"
                        formControlName="last_name"
                    />
                </div>
            </div>
            <div class="alert alert-danger mt-3 mb-0" *ngIf="formError">
                {{ formError }}
            </div>
            <div class="mt-3 d-flex gap-2">
                <button
                    type="submit"
                    class="btn btn-primary"
                    [disabled]="editForm.invalid || submitting"
                >
                    Save
                </button>
                <button
                    type="button"
                    class="btn btn-outline-secondary"
                    (click)="cancelEdit()"
                >
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>
