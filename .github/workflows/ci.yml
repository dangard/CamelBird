name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: CRLF guard
        run: |
          set -e
          bad=""
          while IFS= read -r f; do
            case "$f" in
              *.bat|*.cmd|*.ps1) continue ;;
            esac
            if [ -f "$f" ] && grep -qI $'\r' "$f" 2>/dev/null; then
              bad="${bad}${f}"$'\n'
            fi
          done < <(git ls-files)
          if [ -n "$bad" ]; then
            echo "Files with CRLF endings (expected LF):"
            echo "$bad"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Production build
        run: npx ng build --configuration production

      - name: Unit tests (Jest)
        run: npm test
